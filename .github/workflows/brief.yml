name: Opening Brief

on:
  schedule:
    # GitHub delays scheduled runs, often by 15-60 minutes on weekday
    # mornings, so there are several slots. An early run waits until 8:30 ET,
    # a run between 8:25 and 9:20 ET sends right away, and once one run has
    # sent, the others see the log and exit. Slots in the other season land
    # outside the window and exit within seconds.
    # EDT (Mar-Nov): 8:05, 8:20, 8:45, 9:05 ET
    - cron: "5 12 * * 1-5"
    - cron: "20 12 * * 1-5"
    - cron: "45 12 * * 1-5"
    - cron: "5 13 * * 1-5"
    # EST (Nov-Mar): 8:05 (shares 13:05 UTC above), 8:20, 8:45, 9:05 ET
    - cron: "20 13 * * 1-5"
    - cron: "45 13 * * 1-5"
    - cron: "5 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print to the log instead of sending to Discord"
        type: boolean
        default: false
      date:
        description: "Replay a past day (YYYY-MM-DD). Leave blank for today."
        type: string
        default: ""

permissions:
  contents: write   # to commit logs/

concurrency:
  group: opening-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Get latest logs (a run queued behind another sees its commit)
        run: git pull --ff-only origin ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send brief
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--force"   # manual runs skip the time window
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
            if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          fi
          python -m opening_brief $ARGS

      - name: Commit logs
        if: always()
        run: |
          git config user.name "opening-brief-bot"
          git config user.email "opening-brief-bot@users.noreply.github.com"
          git add logs/
          if git diff --cached --quiet; then
            echo "No log changes."
          else
            git commit -m "Brief log $(TZ=America/New_York date +%F)"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
